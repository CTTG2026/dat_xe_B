<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt xe công ty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF7;
    --panel:#FFFFFF;
    --ink:#1A2233;
    --ink-soft:#5B6472;
    --accent:#2F5D8A;
    --accent-dark:#234867;
    --free:#3F7D58;
    --free-bg:#EAF3EC;
    --busy:#B04632;
    --busy-bg:#FBEDE9;
    --border:#E4E5E1;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    line-height:1.45;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
  }
  header h1{
    font-size:1.5rem;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  header .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
    color:var(--ink-soft);
  }

  section{margin-bottom:26px;}
  h2{
    font-size:0.95rem;
    font-weight:600;
    text-transform:none;
    margin:0 0 12px;
    color:var(--ink);
  }

  /* Timeline hôm nay */
  .timeline-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .timeline-track{
    position:relative;
    height:44px;
    background:var(--free-bg);
    border-radius:6px;
    overflow:hidden;
    margin-top:10px;
  }
  .timeline-block{
    position:absolute;
    top:0;
    bottom:0;
    background:var(--busy-bg);
    border-left:2px solid var(--busy);
    border-right:2px solid var(--busy);
  }
  .timeline-labels{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .timeline-empty{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:10px;
  }

  /* Form */
  form{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    display:grid;
    gap:14px;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  label{
    display:block;
    font-size:0.8rem;
    font-weight:500;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  input, textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:7px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:0.95rem;
    color:var(--ink);
    background:#fff;
  }
  input:focus, textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
    border-color:var(--accent);
  }
  textarea{resize:vertical; min-height:56px;}

  button{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px 18px;
    border-radius:7px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  button:hover{background:var(--accent-dark);}
  button:disabled{background:#B7C2CC; cursor:not-allowed;}

  .msg{
    padding:11px 14px;
    border-radius:7px;
    font-size:0.88rem;
    display:none;
  }
  .msg.error{ display:block; background:var(--busy-bg); color:var(--busy); }
  .msg.success{ display:block; background:var(--free-bg); color:var(--free); }

  /* Danh sách lịch sắp tới */
  .booking-list{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .booking-item{
    display:flex;
    gap:14px;
    padding:13px 18px;
    border-bottom:1px solid var(--border);
    align-items:baseline;
  }
  .booking-item:last-child{border-bottom:none;}
  .booking-time{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
    color:var(--accent-dark);
    white-space:nowrap;
    min-width:118px;
  }
  .booking-info{font-size:0.9rem;}
  .booking-info .name{font-weight:600;}
  .booking-info .dest{color:var(--ink-soft);}
  .empty-state{
    padding:22px 18px;
    color:var(--ink-soft);
    font-size:0.9rem;
  }

  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.78rem;
    margin-top:30px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Đặt xe công ty</h1>
    <div class="date" id="todayLabel"></div>
  </header>

  <section>
    <h2>Lịch xe hôm nay</h2>
    <div class="timeline-card">
      <div class="timeline-track" id="timelineTrack"></div>
      <div class="timeline-labels"><span>06:00</span><span>12:00</span><span>18:00</span><span>22:00</span></div>
      <div class="timeline-empty" id="timelineEmpty" style="display:none;">Xe trống cả ngày hôm nay.</div>
    </div>
  </section>

  <section>
    <h2>Đặt lịch mới</h2>
    <form id="bookingForm">
      <div id="formMsg" class="msg"></div>
      <div>
        <label for="nguoiDat">Tên người đặt</label>
        <input type="text" id="nguoiDat" required placeholder="VD: Nguyễn Văn A">
      </div>
      <div>
        <label for="ngay">Ngày sử dụng</label>
        <input type="date" id="ngay" required>
      </div>
      <div class="row2">
        <div>
          <label for="gioBatDau">Giờ bắt đầu</label>
          <input type="time" id="gioBatDau" required>
        </div>
        <div>
          <label for="gioKetThuc">Giờ kết thúc</label>
          <input type="time" id="gioKetThuc" required>
        </div>
      </div>
      <div>
        <label for="diemDen">Điểm đến</label>
        <input type="text" id="diemDen" placeholder="VD: Sân bay Tân Sơn Nhất">
      </div>
      <div>
        <label for="ghiChu">Ghi chú (không bắt buộc)</label>
        <textarea id="ghiChu" placeholder="Thông tin thêm nếu có"></textarea>
      </div>
      <button type="submit" id="submitBtn">Đặt xe</button>
    </form>
  </section>

  <section>
    <h2>Lịch sắp tới</h2>
    <div class="booking-list" id="bookingList">
      <div class="empty-state">Đang tải lịch...</div>
    </div>
  </section>

  <footer>Vui lòng chỉ đặt xe khi thật sự cần và cập nhật nếu hủy chuyến.</footer>
</div>

<script>
  // ĐIỀN URL WEB APP APPS SCRIPT CỦA BẠN VÀO ĐÂY SAU KHI DEPLOY
  const API_URL = 'https://script.google.com/macros/s/AKfycbyLZaNu3I7RpVRU6oX5SpyOPsKWMsWcO5R-TnA9nknMkWSAYMnyaJbu4bASbkaOfzO7/exec';

  const todayLabel = document.getElementById('todayLabel');
  const bookingList = document.getElementById('bookingList');
  const timelineTrack = document.getElementById('timelineTrack');
  const timelineEmpty = document.getElementById('timelineEmpty');
  const form = document.getElementById('bookingForm');
  const formMsg = document.getElementById('formMsg');
  const submitBtn = document.getElementById('submitBtn');

  function todayISO(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function formatDateVN(iso){
    const [y,m,d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  todayLabel.textContent = formatDateVN(todayISO());
  document.getElementById('ngay').value = todayISO();
  document.getElementById('ngay').min = todayISO();

  async function loadBookings(){
    try{
      const res = await fetch(API_URL);
      const json = await res.json();
      if(!json.ok){ throw new Error(json.error || 'Lỗi tải dữ liệu'); }
      renderTimeline(json.data);
      renderList(json.data);
    }catch(err){
      bookingList.innerHTML = `<div class="empty-state">Không tải được lịch. Kiểm tra lại đường dẫn API. (${err.message})</div>`;
    }
  }

  function renderTimeline(data){
    const today = todayISO();
    const todays = data.filter(b => b.ngay === today);
    timelineTrack.innerHTML = '';
    if(todays.length === 0){
      timelineEmpty.style.display = 'block';
      return;
    }
    timelineEmpty.style.display = 'none';
    const dayStart = 6*60, dayEnd = 22*60; // hiển thị khung 06:00–22:00
    const span = dayEnd - dayStart;
    todays.forEach(b => {
      const [sh, sm] = b.gioBatDau.split(':').map(Number);
      const [eh, em] = b.gioKetThuc.split(':').map(Number);
      let startMin = sh*60+sm, endMin = eh*60+em;
      startMin = Math.max(startMin, dayStart);
      endMin = Math.min(endMin, dayEnd);
      if(endMin <= startMin) return;
      const leftPct = ((startMin - dayStart) / span) * 100;
      const widthPct = ((endMin - startMin) / span) * 100;
      const block = document.createElement('div');
      block.className = 'timeline-block';
      block.style.left = leftPct + '%';
      block.style.width = widthPct + '%';
      block.title = `${b.nguoiDat}: ${b.gioBatDau}–${b.gioKetThuc}`;
      timelineTrack.appendChild(block);
    });
  }

  function renderList(data){
    if(data.length === 0){
      bookingList.innerHTML = '<div class="empty-state">Chưa có lịch đặt xe nào sắp tới.</div>';
      return;
    }
    bookingList.innerHTML = data.map(b => `
      <div class="booking-item">
        <div class="booking-time">${formatDateVN(b.ngay)}<br>${b.gioBatDau}–${b.gioKetThuc}</div>
        <div class="booking-info">
          <div class="name">${escapeHtml(b.nguoiDat)}</div>
          <div class="dest">${escapeHtml(b.diemDen || 'Không ghi điểm đến')}${b.ghiChu ? ' · ' + escapeHtml(b.ghiChu) : ''}</div>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formMsg.className = 'msg';
    formMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang gửi...';

    const payload = {
      nguoiDat: document.getElementById('nguoiDat').value.trim(),
      ngay: document.getElementById('ngay').value,
      gioBatDau: document.getElementById('gioBatDau').value,
      gioKetThuc: document.getElementById('gioKetThuc').value,
      diemDen: document.getElementById('diemDen').value.trim(),
      ghiChu: document.getElementById('ghiChu').value.trim()
    };

    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // tránh preflight CORS
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if(!json.ok){
        formMsg.textContent = json.error;
        formMsg.className = 'msg error';
      } else {
        formMsg.textContent = 'Đặt xe thành công!';
        formMsg.className = 'msg success';
        form.reset();
        document.getElementById('ngay').value = todayISO();
        document.getElementById('ngay').min = todayISO();
        loadBookings();
      }
    }catch(err){
      formMsg.textContent = 'Có lỗi khi gửi yêu cầu: ' + err.message;
      formMsg.className = 'msg error';
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = 'Đặt xe';
    }
  });

  loadBookings();
</script>
</body>
</html>
