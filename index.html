<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt xe công ty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F8;
    --panel:#FFFFFF;
    --ink:#1A2233;
    --ink-soft:#6B7280;
    --badge:#4C5FD5;
    --badge-dark:#3B4BC0;
    --add-btn:#2E9E5B;
    --add-btn-dark:#25824A;
    --border:#E3E5E9;
    --grid-line:#EDEEF2;
    --booked-bg:#FDE68A;
    --booked-bg-hover:#FCD34D;
    --booked-text:#8A5A00;
    --admin-btn:#6B7280;
    --admin-btn-on:#B04632;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 18px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .left-group, .right-group{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .plate{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--badge);
    color:#fff;
    font-weight:700;
    font-size:0.95rem;
    padding:9px 16px;
    border-radius:999px;
    letter-spacing:0.01em;
    white-space:nowrap;
  }
  .plate svg{width:18px;height:18px;flex:none;}
  .controls label{
    font-size:0.85rem;
    font-weight:600;
    color:var(--ink-soft);
  }
  select{
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:7px;
    font-family:inherit;
    font-size:0.88rem;
    background:#fff;
    color:var(--ink);
  }
  .btn-add{
    background:var(--add-btn);
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    font-size:0.88rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .btn-add:hover{background:var(--add-btn-dark);}

  .btn-admin{
    background:#fff;
    color:var(--admin-btn);
    border:1px solid var(--border);
    padding:9px 14px;
    border-radius:8px;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .btn-admin.on{
    background:#FBEDE9;
    color:var(--admin-btn-on);
    border-color:var(--admin-btn-on);
  }

  /* Grid */
  .grid-wrap{
    margin:16px 18px 40px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:auto;
    max-height:78vh;
    position:relative;
  }
  table{
    border-collapse:separate;
    border-spacing:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
  }
  th, td{
    border-right:1px solid var(--grid-line);
    border-bottom:1px solid var(--grid-line);
    padding:0;
    height:22px;
    min-width:52px;
    text-align:center;
    white-space:nowrap;
  }
  thead th{
    position:sticky;
    top:0;
    background:#F7F8FA;
    color:var(--ink-soft);
    font-weight:600;
    padding:8px 4px;
    z-index:2;
    font-family:'Inter',sans-serif;
    font-size:0.75rem;
  }
  thead th.corner{
    left:0;
    z-index:3;
    background:#F7F8FA;
  }
  tbody th{
    position:sticky;
    left:0;
    background:#FAFBFC;
    color:var(--ink-soft);
    font-weight:500;
    padding:0 10px;
    z-index:1;
    border-right:1px solid var(--border);
    text-align:right;
  }
  tbody tr:nth-child(4n+1) td, tbody tr:nth-child(4n+1) th{
    border-top:1px solid var(--border);
  }
  td.slot{cursor:default;}
  td.slot.booked{
    background:var(--booked-bg);
  }
  td.slot.booked.first{ border-top-left-radius:5px; border-top-right-radius:5px; }
  td.slot.booked.last{ border-bottom-left-radius:5px; border-bottom-right-radius:5px; }
  td.slot.booked .label{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:0.62rem;
    font-weight:700;
    color:var(--booked-text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    padding:0 3px;
  }
  body.admin-mode td.slot.booked{
    cursor:pointer;
  }
  body.admin-mode td.slot.booked:hover{
    background:var(--booked-bg-hover);
    outline:1px solid var(--admin-btn-on);
    outline-offset:-1px;
  }

  /* Modal */
  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,24,34,0.45);
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:16px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:#fff;
    border-radius:12px;
    width:100%;
    max-width:420px;
    max-height:90vh;
    overflow:auto;
    padding:22px;
  }
  .modal h3{
    margin:0 0 16px;
    font-size:1.15rem;
    font-weight:700;
  }
  .modal form{display:grid; gap:13px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal label{
    display:block;
    font-size:0.78rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .modal input, .modal textarea{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:7px;
    font-family:'Inter',sans-serif;
    font-size:0.92rem;
    color:var(--ink);
  }
  .modal input:focus, .modal textarea:focus{
    outline:2px solid var(--badge);
    outline-offset:1px;
    border-color:var(--badge);
  }
  .modal textarea{resize:vertical; min-height:52px;}
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:4px;
  }
  .modal-actions button{
    flex:1;
    padding:11px;
    border-radius:8px;
    font-size:0.9rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn-cancel{background:#EEF0F3; color:var(--ink);}
  .btn-submit{background:var(--badge); color:#fff;}
  .btn-submit:disabled{background:#B7BEDB; cursor:not-allowed;}
  .msg{
    padding:10px 12px;
    border-radius:7px;
    font-size:0.85rem;
    display:none;
  }
  .msg.error{display:block; background:#FBEDE9; color:#B04632;}
  .msg.success{display:block; background:#EAF3EC; color:#3F7D58;}

  .legend{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 18px;
    margin-top:12px;
    font-size:0.8rem;
    color:var(--ink-soft);
  }
  .legend .swatch{
    width:14px;height:14px;border-radius:3px;
    background:var(--booked-bg);
    display:inline-block;
  }
  .legend .admin-hint{
    display:none;
    color:var(--admin-btn-on);
    font-weight:600;
  }
  body.admin-mode .legend .admin-hint{ display:inline; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="left-group">
      <span class="plate">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="11" width="18" height="6" rx="1.5" stroke="white" stroke-width="1.8"/><circle cx="7.5" cy="17" r="1.4" fill="white"/><circle cx="16.5" cy="17" r="1.4" fill="white"/></svg>
        BIỂN SỐ XE: <span id="plateNumber">63A20430</span>
      </span>
      <button class="btn-add" id="openModalBtn">+ Đăng ký đặt xe</button>
    </div>
    <div class="right-group">
      <label for="monthSelect">Chọn tháng:</label>
      <select id="monthSelect"></select>
      <button class="btn-admin" id="adminToggleBtn">🔒 Chế độ Admin</button>
    </div>
  </div>

  <div class="legend">
    <span class="swatch"></span> Ô màu vàng = xe đã được đặt trong khung giờ đó
    <span class="admin-hint">&nbsp;· Đang ở chế độ Admin — bấm vào ô đã đặt để xóa</span>
  </div>

  <div class="grid-wrap">
    <table id="grid"></table>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3>Đăng ký đặt xe</h3>
      <div id="formMsg" class="msg"></div>
      <form id="bookingForm">
        <div>
          <label for="nguoiDat">Tên người đặt</label>
          <input type="text" id="nguoiDat" required placeholder="VD: Nguyễn Văn A">
        </div>
        <div>
          <label for="ngay">Ngày sử dụng</label>
          <input type="date" id="ngay" required>
        </div>
        <div class="row2">
          <div>
            <label for="gioBatDau">Giờ bắt đầu</label>
            <input type="time" id="gioBatDau" required>
          </div>
          <div>
            <label for="gioKetThuc">Giờ kết thúc</label>
            <input type="time" id="gioKetThuc" required>
          </div>
        </div>
        <div>
          <label for="ghiChu">Ghi chú (không bắt buộc)</label>
          <textarea id="ghiChu" placeholder="Thông tin thêm nếu có"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelBtn">Hủy</button>
          <button type="submit" class="btn-submit" id="submitBtn">Đặt xe</button>
        </div>
      </form>
    </div>
  </div>

<script>
  // ĐIỀN URL WEB APP APPS SCRIPT CỦA BẠN VÀO ĐÂY SAU KHI DEPLOY
  const API_URL = 'https://script.google.com/macros/s/AKfycbyLZaNu3I7RpVRU6oX5SpyOPsKWMsWcO5R-TnA9nknMkWSAYMnyaJbu4bASbkaOfzO7/exec';
  // Đổi biển số xe hiển thị ở đây nếu cần
  const BIEN_SO_XE = '63A20430';

  const DAY_START_MIN = 5*60;   // 05:00
  const DAY_END_MIN   = 23*60;  // 23:00
  const SLOT_MIN = 15;

  document.getElementById('plateNumber').textContent = BIEN_SO_XE;

  const monthSelect = document.getElementById('monthSelect');
  const gridEl = document.getElementById('grid');
  let allBookings = [];

  // --- Admin mode ---
  let adminMode = false;
  let adminPassword = '';
  const adminToggleBtn = document.getElementById('adminToggleBtn');

  adminToggleBtn.addEventListener('click', () => {
    if (adminMode) {
      adminMode = false;
      adminPassword = '';
      document.body.classList.remove('admin-mode');
      adminToggleBtn.textContent = '🔒 Chế độ Admin';
      adminToggleBtn.classList.remove('on');
    } else {
      const pw = window.prompt('Nhập mật khẩu quản trị để bật chế độ xóa lịch:');
      if (pw === null || pw.trim() === '') return;
      adminPassword = pw.trim();
      adminMode = true;
      document.body.classList.add('admin-mode');
      adminToggleBtn.textContent = '🔓 Đang ở chế độ Admin';
      adminToggleBtn.classList.add('on');
    }
  });

  function pad(n){ return String(n).padStart(2,'0'); }

  function buildMonthOptions(){
    const now = new Date();
    const opts = [];
    for(let offset=-1; offset<=5; offset++){
      const d = new Date(now.getFullYear(), now.getMonth()+offset, 1);
      opts.push({ y:d.getFullYear(), m:d.getMonth()+1 });
    }
    monthSelect.innerHTML = opts.map(o =>
      `<option value="${o.y}-${pad(o.m)}">Tháng ${pad(o.m)}/${o.y}</option>`
    ).join('');
    const cur = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
    monthSelect.value = cur;
  }

  function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }

  // Chỉ hiện các ngày từ (hôm nay - 3 ngày) trở đi; ngày cũ hơn sẽ bị ẩn khỏi lưới
  function getCutoffDate(){
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate() - 3);
  }
  function getVisibleDays(y, m){
    const nDays = daysInMonth(y, m);
    const cutoff = getCutoffDate();
    const visible = [];
    for(let d=1; d<=nDays; d++){
      const dateObj = new Date(y, m-1, d);
      if(dateObj.getTime() >= cutoff.getTime()){
        visible.push(d);
      }
    }
    return visible;
  }

  function buildTimeSlots(){
    const slots = [];
    for(let mins=DAY_START_MIN; mins<DAY_END_MIN; mins+=SLOT_MIN){
      slots.push(mins);
    }
    return slots;
  }
  function minToLabel(mins){
    return pad(Math.floor(mins/60)) + ':' + pad(mins%60);
  }

  function renderGrid(){
    const [y,m] = monthSelect.value.split('-').map(Number);
    const visibleDays = getVisibleDays(y, m);
    const slots = buildTimeSlots();

    const byDate = {};
    allBookings.forEach(b => {
      if(!byDate[b.ngay]) byDate[b.ngay] = [];
      const [sh,sm] = b.gioBatDau.split(':').map(Number);
      const [eh,em] = b.gioKetThuc.split(':').map(Number);
      byDate[b.ngay].push({
        id: b.id,
        startMin: sh*60+sm,
        endMin: eh*60+em,
        nguoiDat: b.nguoiDat,
        ghiChu: b.ghiChu
      });
    });

    if(visibleDays.length === 0){
      gridEl.innerHTML = '<tbody><tr><td style="padding:20px;font-family:Inter,sans-serif;color:#6B7280;">Tháng này không còn ngày nào để hiển thị.</td></tr></tbody>';
      return;
    }

    let html = '<thead><tr><th class="corner">Giờ \\ Ngày</th>';
    visibleDays.forEach(d => {
      html += `<th>${d}/${pad(m)}</th>`;
    });
    html += '</tr></thead><tbody>';

    slots.forEach(mins => {
      html += `<tr><th>${minToLabel(mins)}</th>`;
      visibleDays.forEach(d => {
        const dateStr = `${y}-${pad(m)}-${pad(d)}`;
        const bookings = byDate[dateStr] || [];
        const match = bookings.find(b => mins >= b.startMin && mins < b.endMin);
        if(match){
          const isFirst = mins === match.startMin || mins === DAY_START_MIN;
          const isLast = (mins + SLOT_MIN) >= match.endMin || (mins+SLOT_MIN) === DAY_END_MIN;
          const showLabel = mins === match.startMin || (mins === DAY_START_MIN && match.startMin < DAY_START_MIN);
          const title = `${match.nguoiDat}: ${minToLabel(match.startMin)}–${minToLabel(match.endMin)}${match.ghiChu ? ' · ' + match.ghiChu : ''}`;
          html += `<td class="slot booked${isFirst?' first':''}${isLast?' last':''}" data-id="${escapeAttr(match.id)}" data-name="${escapeAttr(match.nguoiDat)}" data-date="${dateStr}" data-start="${minToLabel(match.startMin)}" data-end="${minToLabel(match.endMin)}" title="${escapeAttr(title)}">${showLabel ? `<span class="label">${escapeHtml(match.nguoiDat)}</span>` : ''}</td>`;
        } else {
          html += '<td class="slot"></td>';
        }
      });
      html += '</tr>';
    });
    html += '</tbody>';
    gridEl.innerHTML = html;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function escapeAttr(str){
    return String(str).replace(/"/g,'&quot;');
  }

  async function loadBookings(){
    try{
      const res = await fetch(API_URL);
      const json = await res.json();
      if(!json.ok) throw new Error(json.error || 'Lỗi tải dữ liệu');
      allBookings = json.data;
      renderGrid();
    }catch(err){
      gridEl.innerHTML = `<tbody><tr><td style="padding:20px;font-family:Inter,sans-serif;color:#B04632;">Không tải được lịch. Kiểm tra lại đường dẫn API. (${err.message})</td></tr></tbody>`;
    }
  }

  monthSelect.addEventListener('change', renderGrid);

  // Xóa lịch (chỉ hoạt động khi bật chế độ Admin)
  gridEl.addEventListener('click', async (e) => {
    if(!adminMode) return;
    const cell = e.target.closest('td.slot.booked');
    if(!cell) return;

    const name = cell.dataset.name;
    const date = cell.dataset.date;
    const start = cell.dataset.start;
    const end = cell.dataset.end;
    const id = cell.dataset.id;

    const confirmed = window.confirm(`Xóa lịch của "${name}" ngày ${date}, ${start}–${end}?`);
    if(!confirmed) return;

    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', id: id, password: adminPassword })
      });
      const json = await res.json();
      if(!json.ok){
        alert('Không xóa được: ' + json.error);
        if(String(json.error).includes('Sai mật khẩu')){
          adminMode = false;
          adminPassword = '';
          document.body.classList.remove('admin-mode');
          adminToggleBtn.textContent = '🔒 Chế độ Admin';
          adminToggleBtn.classList.remove('on');
        }
      } else {
        await loadBookings();
      }
    }catch(err){
      alert('Có lỗi khi xóa: ' + err.message);
    }
  });

  // Modal đặt xe
  const overlay = document.getElementById('overlay');
  const openModalBtn = document.getElementById('openModalBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const form = document.getElementById('bookingForm');
  const formMsg = document.getElementById('formMsg');
  const submitBtn = document.getElementById('submitBtn');

  function todayISO(){
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }

  function openModal(){
    overlay.classList.add('open');
    formMsg.className = 'msg';
    formMsg.style.display = 'none';
    form.reset();
    document.getElementById('ngay').value = todayISO();
    document.getElementById('ngay').min = todayISO();
  }
  function closeModal(){ overlay.classList.remove('open'); }

  openModalBtn.addEventListener('click', openModal);
  cancelBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formMsg.className = 'msg';
    formMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang gửi...';

    const payload = {
      nguoiDat: document.getElementById('nguoiDat').value.trim(),
      ngay: document.getElementById('ngay').value,
      gioBatDau: document.getElementById('gioBatDau').value,
      gioKetThuc: document.getElementById('gioKetThuc').value,
      ghiChu: document.getElementById('ghiChu').value.trim()
    };

    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if(!json.ok){
        formMsg.textContent = json.error;
        formMsg.className = 'msg error';
      } else {
        formMsg.textContent = 'Đặt xe thành công!';
        formMsg.className = 'msg success';
        await loadBookings();
        setTimeout(closeModal, 900);
      }
    }catch(err){
      formMsg.textContent = 'Có lỗi khi gửi yêu cầu: ' + err.message;
      formMsg.className = 'msg error';
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = 'Đặt xe';
    }
  });

  buildMonthOptions();
  renderGrid();
  loadBookings();
</script>
</body>
</html>
